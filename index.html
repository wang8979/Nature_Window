<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body>
    <canvas id="myCanvas" width="320" height="200"></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d"); //从上下文获取2D模式 画笔

      const treeImage = new Image();
      treeImage.src = "./Assets/tree.png";

      let currentSeedStr = "MySecretForest";

      // 作用：把 "MySecretForest" 变成一个巨大的数字，作为初始种子
      function stringToHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          let char = str.charCodeAt(i);
          hash = (hash << 5) - hash + char;
          hash = hash & hash; // Convert to 32bit integer
        }
        return Math.abs(hash);
      }

      // 初始化种子数字
      let seed = stringToHash(currentSeedStr);

      function myRandom() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      }

      let forest = []; //森林数组，用来存储所有的树

      for (let i = 0; i < 100; i++) {
        let yPots = myRandom() * canvas.height;

        let size = (yPots / canvas.height) * 30 + 10;
        forest.push({
          x: myRandom() * canvas.width,
          y: yPots,
          size: size,
          swayOffset: myRandom() * Math.PI * 2, // 晃动幅度不同，这里加了一个2PI
        });
      }

      //定义全局时间变量来控制风
      let time = 0;

      forest.sort((a, b) => a.y - b.y); // 按 y 坐标排序

      function gameLoop() {
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, "#87CEEB");
        gradient.addColorStop(1, "#E0F7FA");
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        time += 0.05;

        forest.forEach((tree) => {
          let sway = Math.sin(time + tree.swayOffset) * 2; //摆动幅度

          ctx.drawImage(treeImage, tree.x + sway, tree.y, tree.size, tree.size); //绘制树，10*10的矩形，Rect是矩形缩写

          //ctx.fillStyle = "#228B22";
          //ctx.fillRect(tree.x, tree.y, tree.size, tree.size); //绘制树，10*10的矩形，Rect是矩形缩写
        }); //随机分布

        //是浏览器提供的最强 API。它会尽可能配合显示器的刷新率（比如 60Hz），保证动画如丝般顺滑
        requestAnimationFrame(gameLoop); //递归调用，下一帧继续运行 gameLoop
      }
      treeImage.onload = function () {
        gameLoop();
      };
    </script>
  </body>
</html>
