<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background-color: #999;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
      }
    </style>
  </head>

  <body>
    <canvas id="myCanvas" width="320" height="200"></canvas>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d"); //从上下文获取2D模式 画笔

      let treeX = 150; //树的初始坐标
      let treeY = 0;

      function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); //清楚画布，从0，0开始清除

        treeY = treeY + 1;
        treeX = treeX + 1; //树向右移动

        if (treeY > 200) {
          treeY = 0;
          treeX = Math.random() * 300; //0~1之间
        }

        ctx.fillStyle = "#228B22";
        ctx.fillRect(treeX, treeY, 10, 20); //绘制树，10*10的矩形，Rect是矩形缩写

        //是浏览器提供的最强 API。它会尽可能配合显示器的刷新率（比如 60Hz），保证动画如丝般顺滑
        requestAnimationFrame(gameLoop); //递归调用，下一帧继续运行 gameLoop
      }
      gameLoop();
    </script>
  </body>
</html>
