<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        font-family: "Courier New", Courier, monospace;
        overflow: hidden; /* 防止出现滚动条 */
      }
      /*画布容器层*/
      #container {
        position: relative;
        width: 100vw;
        height: 100vh;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* 0 0 20px 模糊半径  rgba(0, 0, 0, 0.5) 阴影颜色 */
      }
      canvas {
        border: 2px solid #333;
        image-rendering: pixelated;
        width: 100%;
        height: 100%;
        display: block; /* 确保canvas占满容器 */
      }
      /*UI悬浮层*/
      #uiLayer {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 5px;
        z-index: 10; /* 确保在最上层 */
      }
      #timeDisplay {
        color: #fff;
        font-weight: bold;
        padding: 8px;
        background-color: rgba(0, 0, 0, 0.5);
        border: 2px solid #fff;
      }
      input {
        background: rgba(255, 255, 255, 0.8);
        border: 2px solid #000;
        padding: 4px;
        width: 100px;
        font-family: inherit;
        font-weight: bold;
      }
      button {
        background: #ff69b4; /* 粉色按钮 */
        border: 2px solid #000;
        cursor: pointer;
        font-family: inherit;
        font-weight: bold;
        box-shadow: 2px 2px 0px #000; /* 复古立体感 */
      }
      button:active {
        transform: translate(2px, 2px); /* 点击时的下压效果 */
        box-shadow: none;
      }
    </style>
  </head>

  <body>
    <div id="container">
      <div id="uiLayer">
        <input type="text" id="seedInput" value="Dream" maxlength="15" />
        <button id="generateBtn">生成</button>
        <div id="timeDisplay">12:00</div>
      </div>

      <canvas id="myCanvas"></canvas>
    </div>

    <script>
      const canvas = document.getElementById("myCanvas");
      const ctx = canvas.getContext("2d"); //从上下文获取2D模式 画笔

      const treeImage = new Image();
      const stoneImage = new Image();
      const flowerImage = new Image();

      treeImage.src = "./Assets/tree.png";
      stoneImage.src = "./Assets/stone.png";
      flowerImage.src = "./Assets/flower.png";

      const dayAudio = new Audio("./Assets/day.mp3");
      const nightAudio = new Audio("./Assets/night.mp3");

      dayAudio.loop = true; //设置循环播放
      nightAudio.loop = true;

      dayAudio.volume = 0;
      nightAudio.volume = 0;

      let audioStarted = false; //声音是否启动

      // 作用：把 "MySecretForest" 变成一个巨大的数字，作为初始种子
      function stringToHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
          let char = str.charCodeAt(i); //获取字符串的AsCII码
          hash = (hash << 5) - hash + char; //左移五位 = *32，减去1个hash 31, 质数减少哈希冲突
          hash = hash & hash; // 确保是32位整数，其余不要
        }
        return Math.abs(hash); //返回一个非负整数
      }

      let seed = 0;
      let forest = []; //森林数组，用来存储所有的树

      // 伪随机数生成器，生成0~1之间的随机数，实际提供一个稳定的序列，而不是单个值
      function myRandom() {
        seed = (seed * 9301 + 49297) % 233280;
        return seed / 233280;
      }

      //颜色混合算法
      function lerpColor(a, b, amount) {
        //其中'/ /g'代表寻找全部，“#”进行空值代替，并且将16进制的数转换为10进制
        const ah = parseInt(a.replace(/#/g, ""), 16),
          //8位二进制来进行与运算，同1才记录
          //就比如说你读取 123456 ，但实际记录的时候是 先存的6，因此要右移去找R通道
          ar = (ah >> 16) & 0xff,
          ag = (ah >> 8) & 0xff,
          ab = ah & 0xff,
          bh = parseInt(b.replace(/#/g, ""), 16),
          br = (bh >> 16) & 0xff,
          bg = (bh >> 8) & 0xff,
          bb = bh & 0xff,
          rr = ar + (br - ar) * amount,
          rg = ag + (bg - ag) * amount,
          rb = ab + (bb - ab) * amount;
        return (
          "#" +
          (((1 << 24) + (rr << 16) + (rg << 8) + rb) | 0).toString(16).slice(1)
        ); //这个1相当于去占位，任务完成就给他删了，这个|0是为了确保结果是32位整数
      }

      const skyStates = [
        { time: 0, name: "午夜", top: "#000022", bottom: "#001133" }, // 0点
        { time: 5, name: "黎明", top: "#223344", bottom: "#FF9966" }, // 5点
        { time: 8, name: "清晨", top: "#4488FF", bottom: "#AAEEFF" }, // 8点
        { time: 12, name: "正午", top: "#87CEEB", bottom: "#E0F7FA" }, // 12点
        { time: 17, name: "傍晚", top: "#3366CC", bottom: "#FFCC66" }, // 17点
        { time: 19, name: "黄昏", top: "#220044", bottom: "#FF6633" }, // 19点
        { time: 21, name: "夜晚", top: "#000033", bottom: "#112244" }, // 21点
        { time: 24, name: "午夜", top: "#000022", bottom: "#001133" }, // 24点(回到0点)
      ];

      let gameTime = 12.0; //时间

      function getCurrentSky() {
        let startState = skyStates[0];
        let endState = skyStates[0];
        //获取区域分段
        for (let i = 0; i < skyStates.length; i++) {
          if (gameTime < skyStates[i].time) {
            startState = skyStates[i - 1];
            endState = skyStates[i];
            break;
          }
        }
        //计算进度
        const duration = endState.time - startState.time;
        const progress = (gameTime - startState.time) / duration;
        //混合颜色
        const currentTop = lerpColor(startState.top, endState.top, progress);
        const currentBottom = lerpColor(
          startState.bottom,
          endState.bottom,
          progress
        );
        return {
          top: currentTop,
          bottom: currentBottom,
          name: startState.name,
        };
      }

      //屏幕自适应逻辑
      function resize() {
        const scale = 4;
        canvas.width = Math.ceil(window.innerWidth / scale);
        canvas.height = Math.ceil(window.innerHeight / scale);

        ctx.imageSmoothingEnabled = false; //改变画布大小会重置抗锯齿功能，在这里直接关闭即可
        generateWorld(currentSeedStr); //重新生成是树木以铺满
      }

      //包装生成逻辑为函数
      function generateWorld(userSeedStr) {
        currentSeedStr = userSeedStr; // 记住当前的种子
        seed = stringToHash(userSeedStr); //重置种子
        forest = []; // 清空森林数组

        const density = (canvas.width * canvas.height) / 400; // 树的密度，根据屏幕大小调整

        for (let i = 0; i < density; i++) {
          let yPots = myRandom() * canvas.height;
          let size = (yPots / canvas.height) * 30 + 10;

          let dice = myRandom();
          let type = "tree";
          let img = treeImage;

          if (dice < 0.15) {
            type = "stone";
            img = stoneImage;
            size = size * 0.5;
          } else if (dice < 0.4) {
            type = "flower";
            img = flowerImage;
            size = size * 0.3;
          }

          forest.push({
            x: myRandom() * canvas.width,
            y: yPots,
            size: size,
            swayOffset: myRandom() * Math.PI * 2, // 晃动幅度不同，这里加了一个2PI
            type: type,
            img: img,
          });
        }

        forest.sort((a, b) => a.y - b.y); // 按 y 坐标排序，先画小的后画大的防止不正常遮盖
        console.log(`世界已重置，种子: ${userSeedStr}`);
      }

      function updateAudioMixing() {
        if (!audioStarted) return;

        let dayVolume = 0;

        //规定6点到18点为白天，其他为晚上
        if (gameTime >= 6 && gameTime < 18) {
          dayVolume = 1;
        } else if (gameTime > 5 && gameTime < 6) {
          dayVolume = gameTime - 5;
        } else if (gameTime > 17 && gameTime < 18) {
          dayVolume = 1 - (gameTime - 17);
        } else {
          dayVolume = 0;
        }
        let nightVolume = 1 - dayVolume;
        dayAudio.volume = Math.max(0, Math.min(1, dayVolume)); //最大音量设为1
        nightAudio.volume = Math.max(0, Math.min(1, nightVolume));
      }

      //定义全局时间变量来控制风
      let time = 0;

      function gameLoop() {
        // A. 更新游戏时间 (让时间流逝！)
        gameTime += 0.01;
        if (gameTime >= 24) gameTime = 0; // 过了24点回到0点

        updateAudioMixing(); //调节音量

        // B. 计算天空颜色
        const sky = getCurrentSky();
        // C. 更新UI上的时间显示
        const hours = Math.floor(gameTime); //取整数
        const minutes = Math.floor((gameTime - hours) * 60);
        document.getElementById("timeDisplay").innerText = `${hours
          .toString()
          .padStart(2, "0")}:${minutes.toString().padStart(2, "0")}`;
        // D. 绘制背景
        let gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
        gradient.addColorStop(0, sky.top); // 顶部颜色
        gradient.addColorStop(1, sky.bottom); // 底部颜色
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // E. 绘制物体
        time += 0.05;
        forest.forEach((obj) => {
          let sway = 0;
          if (obj.type !== "stone") {
            sway = Math.sin(time + obj.swayOffset) * 2; //摆动幅度
            if (obj.type === "flower") {
              sway *= 0.5;
            }
          }
          if (obj.img.complete) {
            ctx.drawImage(obj.img, obj.x + sway, obj.y, obj.size, obj.size); //绘制树，10*10的矩形，Rect是矩形缩写
          }
          //ctx.fillStyle = "#228B22";
          //ctx.fillRect(obj.x, obj.y, obj.size, obj.size); //绘制树，10*10的矩形，Rect是矩形缩写
        });

        //是浏览器提供的最强 API。它会尽可能配合显示器的刷新率（比如 60Hz），保证动画如丝般顺滑
        requestAnimationFrame(gameLoop); //递归调用，下一帧继续运行 gameLoop
      }

      const btn = document.getElementById("generateBtn");
      const input = document.getElementById("seedInput");

      //监听点击事件
      btn.onclick = function () {
        let text = input.value;
        if (text.trim() === "") text = "Random"; // 防止空输入
        generateWorld(text);

        //尝试播放声音
        if (!audioStarted) {
          dayAudio
            .play()
            .then(() => {
              console.log("白天音效启动");
            })
            .catch((e) => console.log("音效播放失败:", e));
          nightAudio
            .play()
            .then(() => {
              console.log("晚上音效启动");
            })
            .catch((e) => console.log("音效播放失败:", e));

          audioStarted = true;
          btn.innerText = "生成 (♪)"; // 改个名字提示有声音了
        }
      };

      window.addEventListener("resize", resize); // 监听窗口变化事件,当用户拖拽窗口时，自动重绘
      //第一个是监听到的事件类型，第二个是触发的函数

      treeImage.onload = function () {
        generateWorld("Dream"); // 默认种子
        resize();
        gameLoop();
      };
    </script>
  </body>
</html>
